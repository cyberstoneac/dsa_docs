site_name: DSA Notes (Java)
site_description: Comprehensive Data Structures & Algorithms notes with 150+ Java solutions, aligned with NeetCode 150
site_author: Jagdish
site_url: https://cyberstoneac.github.io/dsa_docs/

repo_name: cyberstoneac/dsa_docs
repo_url: https://github.com/cyberstoneac/dsa_docs
edit_uri: edit/main/docs/

theme:
  favicon: assets/icon.svg
  logo: assets/icon.svg
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  features:
    - navigation.instant          # Instant page loads (SPA-like)
    - navigation.instant.progress # Progress bar on navigation
    - navigation.tracking         # URL updates with scroll
    - navigation.tabs             # Top-level nav as tabs
    - navigation.tabs.sticky      # Tabs stay visible on scroll
    - navigation.sections         # Group nav items
    - navigation.expand           # Expand all sections by default
    - navigation.path             # Breadcrumb path
    - navigation.top              # Back-to-top button
    - navigation.footer           # Previous/Next footer links
    - search.suggest              # Search suggestions as you type
    - search.highlight            # Highlight search terms
    - search.share                # Share search results
    - toc.follow                  # TOC follows scroll
    - content.code.copy           # Copy button on code blocks
    - content.code.select         # Select code block
    - content.code.annotate       # Code annotations
    - content.tabs.link           # Link tabs across pages

plugins:
  # - search:
  #     lang: en
  #     separator: '[\s\-\.]+'
  - tags:
      tags_file: tags.md
  - minify:
      minify_html: true
  - plantuml-local:
      shortname: plantuml
      cache: true
  - d2:
      theme: 0
      dark_theme: 200
  - glightbox:
      zoomable: true
  - panzoom:
      full_screen: True   # optional — enable fullscreen button

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plantuml
          class: plantuml
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: d2
          class: d2
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

extra_css:
  - stylesheets/extra.css

